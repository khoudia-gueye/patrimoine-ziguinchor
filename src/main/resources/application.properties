spring.application.name=patrimoine-ziguinchor
server.port=8080

# === Base de donnees MySQL (via XAMPP) ===
spring.datasource.url=jdbc:mysql://localhost:3306/patrimoine_ziguinchor?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never
spring.thymeleaf.cache=false

