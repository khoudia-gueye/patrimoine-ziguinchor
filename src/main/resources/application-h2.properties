# === Profil "h2" : base en mémoire, aucune base externe, gratuite et sans expiration ===
# Activer avec SPRING_PROFILES_ACTIVE=h2
# Attention : les données ajoutées sont perdues à chaque redémarrage
# (les données de départ sont recréées par DonneesInitiales).
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:patrimoinedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=never
spring.thymeleaf.cache=true
