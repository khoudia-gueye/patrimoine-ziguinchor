<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: pageHead('Catégories')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Catégories de sites touristiques</h2>
        <a sec:authorize="hasRole('CONSERVATEUR')" th:href="@{/categories/nouveau}" class="btn btn-success">+ Nouvelle catégorie</a>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-success">
        <tr><th>Nom</th><th>Description</th><th>Nombre de sites</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="cat : ${categories}">
            <td th:text="${cat.nom}">Nom</td>
            <td th:text="${cat.description}">Description</td>
            <td th:text="${#lists.size(cat.sites)}">0</td>
            <td>
                <a sec:authorize="hasRole('CONSERVATEUR')" th:href="@{/categories/modifier/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-primary">Modifier</a>
                <a sec:authorize="hasRole('CONSERVATEUR')" th:href="@{/categories/supprimer/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('Supprimer cette catégorie ?');">Supprimer</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categories)}"><td colspan="4" class="text-center text-muted">Aucune catégorie enregistrée.</td></tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
