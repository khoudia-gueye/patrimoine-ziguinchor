<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Inscription')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-5" style="max-width: 500px;">
    <h2 class="mb-4">Créer un compte</h2>

    <div class="alert alert-danger" th:if="${erreurEmail}" th:text="${erreurEmail}"></div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="mb-3">
            <label class="form-label">Nom complet</label>
            <input type="text" th:field="*{nom}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" th:field="*{motDePasse}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Je m'inscris en tant que :</label>
            <select name="roleChoisi" class="form-select">
                <option value="VISITEUR">Visiteur</option>
                <option value="OPERATEUR_TOURISTIQUE">Opérateur touristique</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">S'inscrire</button>
        <a th:href="@{/login}" class="btn btn-outline-secondary">J'ai déjà un compte</a>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
