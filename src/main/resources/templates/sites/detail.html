<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: pageHead(${site.nom})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-5">
    <div class="row">
        <div class="col-md-7">
            <img th:if="${site.imageUrl}" th:src="${site.imageUrl}" class="img-fluid rounded shadow-sm mb-3" alt="Image du site"/>
            <h2 th:text="${site.nom}">Nom du site</h2>
            <span class="badge bg-success" th:if="${site.categorie}" th:text="${site.categorie.nom}">Catégorie</span>
            <p class="text-muted mt-2" th:text="${site.quartier} + (${site.adresse} != null ? ', ' + ${site.adresse} : '')">Localisation</p>
            <p th:text="${site.description}">Description complète du site.</p>

            <div class="mt-3">
                <a sec:authorize="hasRole('CONSERVATEUR')" th:href="@{/sites/modifier/{id}(id=${site.id})}" class="btn btn-outline-primary btn-sm">Modifier</a>
                <a sec:authorize="hasRole('CONSERVATEUR')" th:href="@{/sites/supprimer/{id}(id=${site.id})}" class="btn btn-outline-danger btn-sm"
                   onclick="return confirm('Confirmer la suppression ?');">Supprimer</a>
                <a th:href="@{/sites}" class="btn btn-outline-secondary btn-sm">Retour à la liste</a>
            </div>
        </div>

        <div class="col-md-5">
            <h4>Avis des visiteurs
                <span class="badge bg-warning text-dark" th:text="${#numbers.formatDecimal(site.noteMoyenne, 1, 1)} + ' / 5'">0/5</span>
            </h4>

            <div class="card mb-3" th:each="a : ${site.avis}">
                <div class="card-body py-2">
                    <strong th:text="${a.auteur}">Auteur</strong>
                    <span class="text-warning" th:text="${#strings.repeat('★', a.note)}">★★★</span>
                    <p class="mb-1" th:text="${a.commentaire}">Commentaire</p>
                    <small class="text-muted" th:text="${a.dateAvis}">Date</small>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(site.avis)}" class="text-muted">Aucun avis pour le moment. Soyez le premier à commenter !</p>

            <hr/>
            <h5>Laisser un avis</h5>
            <div sec:authorize="!isAuthenticated()" class="alert alert-info">
                <a th:href="@{/login}">Connecte-toi</a> pour laisser un avis sur ce site.
            </div>
            <form sec:authorize="hasRole('VISITEUR')" th:action="@{/sites/{id}/avis(id=${site.id})}" th:object="${nouvelAvis}" method="post">
                <div class="mb-2">
                    <input type="text" th:field="*{auteur}" class="form-control" placeholder="Votre nom" required/>
                </div>
                <div class="mb-2">
                    <select th:field="*{note}" class="form-select">
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Très bien</option>
                        <option value="3">3 - Correct</option>
                        <option value="2">2 - Moyen</option>
                        <option value="1">1 - Décevant</option>
                    </select>
                </div>
                <div class="mb-2">
                    <textarea th:field="*{commentaire}" class="form-control" rows="3" placeholder="Votre commentaire" required></textarea>
                </div>
                <button type="submit" class="btn btn-success btn-sm">Envoyer</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
